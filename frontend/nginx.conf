server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Built JS/CSS files have a content hash in their names, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so users always get the latest version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Any other path is a client-side route: serve the app and let React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}