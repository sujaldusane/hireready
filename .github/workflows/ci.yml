name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: hireready_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d hireready_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/hireready_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Apply migrations to a fresh database
        run: flask --app run db upgrade
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/hireready_test
          JWT_SECRET_KEY: ci-only-secret-key-not-used-for-anything-real

      - run: pytest -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]

    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      ANTHROPIC_API_KEY: not-needed-for-build
      JWT_SECRET_KEY: not-needed-for-build

    steps:
      - uses: actions/checkout@v5

      - run: docker compose build

  deploy:
    name: Publish and deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hireready-backend:latest
            ghcr.io/${{ github.repository_owner }}/hireready-backend:${{ github.sha }}

      - name: Trigger backend deploy on Render
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$RENDER_BACKEND_DEPLOY_HOOK"

      - name: Trigger frontend deploy on Render
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$RENDER_FRONTEND_DEPLOY_HOOK"